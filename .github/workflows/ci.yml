# 题目01 CI 门禁与部署冒烟
# 1) test：gofmt / vet / 单测（真实 MySQL + Mongo 服务）/ 覆盖率 ≥85% 门禁
# 2) deploy-smoke：compose 起 MySQL+三服务 → scripts/smoke-http.sh 全链路取证 → 运行 ID 留痕
name: trade-ci

on:
  push:
    branches: ["dev/**", "main"]
  pull_request:
    branches: ["dev/**", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: questions
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt 检查
        run: |
          UNFORMATTED=$(gofmt -l internal pkg cmd)
          if [ -n "$UNFORMATTED" ]; then
            echo "以下文件未格式化："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test（题目01 相关模块，门禁）
        env:
          # 连不上 MySQL/Mongo 时直接失败，避免 TestMain 静默跳过导致假绿
          TRADE_REQUIRE_DB: "1"
        run: go test -count=1 ./internal/... ./pkg/middleware/...

      - name: go test（脚手架其余包，信息项）
        run: go test -count=1 ./pkg/... ./cmd/...
        continue-on-error: true

      - name: 覆盖率（order 模块口径，门禁 ≥85%）
        env:
          TRADE_REQUIRE_DB: "1"
        run: |
          mkdir -p reports
          go test -count=1 -coverpkg=./internal/order/... \
            -coverprofile=reports/coverage.out \
            ./internal/order/... ./pkg/middleware/... >/dev/null
          go tool cover -func=reports/coverage.out -o reports/coverage.func
          TOTAL=$(tail -1 reports/coverage.func | awk '{print $3}' | tr -d '%')
          echo "模块口径覆盖率：${TOTAL}%"
          go tool cover -html=reports/coverage.out -o reports/coverage.html
          if ! awk -v t="$TOTAL" 'BEGIN { exit !(t >= 85) }'; then
            echo "覆盖率 ${TOTAL}% 低于 85% 门禁"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            reports/coverage.out
            reports/coverage.func
            reports/coverage.html

  deploy-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像并启动题目01 环境
        run: GATEWAY_PORT=18080 docker compose -f docker-compose.trade.yml up -d --build

      - name: HTTP 冒烟（S1/S3/S4 + 运营核查 + 越权）
        run: BASE_URL=http://127.0.0.1:18080 bash scripts/smoke-http.sh

      - name: 失败时输出容器日志
        if: failure()
        run: docker compose -f docker-compose.trade.yml logs --tail 200 user order gateway

      - name: 收尾并记录运行 ID
        if: always()
        run: |
          echo "运行 ID：github actions ${GITHUB_RUN_ID}/${GITHUB_RUN_NUMBER} @ ${GITHUB_SHA}"
          docker compose -f docker-compose.trade.yml down -v
