<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客服 · 退款审核 · SHOP-OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6df6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span>SHOP-OS <small>客服 · 退款审核</small></div>
    <nav class="nav">
      <a href="/">总览</a>
      <a href="/buyer.html">买家</a>
      <a href="/warehouse.html">仓库</a>
      <a href="/refund.html" class="active">客服·退款</a>
      <a href="/exception.html">客服·异常</a>
      <a href="/ops.html">运营</a>
    </nav>
    <div class="session" id="session"></div>
  </header>

  <div class="wrap">
    <div id="loginPanel" class="login"></div>

    <div id="main" hidden>
      <div class="page-head">
        <div>
          <h1>退款审核</h1>
          <p>同意后触发渠道退款：首次可失败（订单保持退款审核中），再次同意即重试；重复提交幂等返回 <span class="mono">duplicate=true</span>。</p>
        </div>
        <button class="btn ghost" id="refreshBtn">刷新</button>
      </div>

      <div class="card">
        <h2>待审核订单</h2>
        <div id="orders"></div>
      </div>
    </div>
  </div>

  <aside class="drawer" id="drawer">
    <header><h3 id="drawerTitle">订单详情</h3><button class="btn sm ghost" onclick="Shop.closeDrawer()">关闭</button></header>
    <div class="body" id="drawerBody"></div>
  </aside>
  <div class="toast" id="toast"></div>

  <script src="/assets/app.js"></script>
  <script>
    const { api, mount, toast, money, badge, escapeHTML, openDrawer } = Shop;
    let s = { token: '', user: {} };

    function row(o) {
      const id = escapeHTML(o.id);
      const fail = o.refundFail ? '<span class="badge bad">上次退款失败</span>' : '';
      return `<tr>
        <td class="mono">${id}</td>
        <td>${escapeHTML(o.buyerName || o.buyerId)}</td>
        <td>${escapeHTML(o.productName)}<br><span class="hint">×${o.qty}</span></td>
        <td class="num">${money(o.amountCents)}</td>
        <td>${badge(o.status)} ${fail}</td>
        <td>
          <div class="row" style="gap:6px">
            <input id="reason-${id}" placeholder="驳回原因（同意可留空）" style="flex:1 1 180px" />
            <button class="btn primary sm" onclick="audit('${id}', true)">同意退款</button>
            <button class="btn danger sm" onclick="audit('${id}', false)">驳回</button>
            <button class="btn sm" onclick="showDetail('${id}')">详情</button>
          </div>
        </td>
      </tr>`;
    }

    async function load() {
      const box = document.getElementById('orders');
      try {
        const data = await api('/cs/refunds', { token: s.token });
        const items = data.items || [];
        box.innerHTML = items.length ? `
          <table>
            <thead><tr><th>订单号</th><th>买家</th><th>商品</th><th class="num">金额</th><th>状态</th><th>审核</th></tr></thead>
            <tbody>${items.map(row).join('')}</tbody>
          </table>` : '<div class="empty">当前没有待审核退款</div>';
      } catch (err) {
        box.innerHTML = `<div class="empty">加载失败：${escapeHTML(err.message)}</div>`;
      }
    }

    async function audit(orderId, approve) {
      const reason = document.getElementById('reason-' + orderId).value.trim();
      if (!approve && !reason) { toast('驳回必须填写原因', 'bad'); return; }
      try {
        const result = await api('/cs/refunds/' + orderId + '/audit', {
          method: 'POST', token: s.token, body: { approve, reason }
        });
        const status = result.order ? result.order.status : '';
        if (result.duplicate) {
          toast(`幂等返回：该订单已处理（${status}），未重复打款`, 'ok');
        } else if (approve && status === 'REFUNDING') {
          toast('渠道退款失败，订单仍为退款审核中；再次点击“同意退款”可重试', 'bad');
        } else {
          toast(`审核完成：订单 ${status}${result.message ? ' · ' + result.message : ''}`, 'ok');
        }
        await load();
      } catch (err) {
        toast('审核失败：' + err.message + (err.code ? '（' + err.code + '）' : ''), 'bad');
      }
    }

    async function showDetail(orderId) {
      try {
        const o = await api('/trade/orders/' + orderId, { token: s.token });
        const ledgers = (o.ledgers || []).map((l) => `
          <div class="item" data-kind="${escapeHTML(l.kind)}">
            <span class="dot"></span>
            <div><div class="text">${escapeHTML(l.text)} ${l.amountCents ? `<strong>${money(l.amountCents)}</strong>` : ''}</div>
            <div class="meta">${escapeHTML(l.time)}${l.status ? ' · ' + escapeHTML(l.status) : ''}</div></div>
          </div>`).join('') || '<div class="empty">暂无台账</div>';
        openDrawer('订单 ' + o.id, `
          <dl class="kv">
            <dt>状态</dt><dd>${badge(o.status)}${o.refundFail ? ' <span class="badge bad">上次渠道退款失败</span>' : ''}</dd>
            <dt>买家</dt><dd>${escapeHTML(o.buyerName)}（${escapeHTML(o.buyerId)}）</dd>
            <dt>商品</dt><dd>${escapeHTML(o.productName)} ×${o.qty}</dd>
            <dt>金额</dt><dd>${money(o.amountCents)}</dd>
            ${o.rejectReason ? `<dt>上次驳回</dt><dd>${escapeHTML(o.rejectReason)}</dd>` : ''}
          </dl>
          <h3 style="margin:18px 0 10px">台账时间线</h3>
          <div class="timeline">${ledgers}</div>`);
      } catch (err) {
        toast('详情加载失败：' + err.message, 'bad');
      }
    }

    mount('cs', async (sess) => {
      s = sess;
      document.getElementById('refreshBtn').onclick = load;
      await load();
    });
  </script>
</body>
</html>
